auth_request_set $auth_user   $upstream_http_remote_user;
auth_request_set $auth_email  $upstream_http_remote_email;
auth_request_set $auth_groups $upstream_http_remote_groups;

proxy_set_header X-Auth-User   $auth_user;
proxy_set_header X-Auth-Email  $auth_email;
proxy_set_header X-Auth-Groups $auth_groups;


# **Verify these header names against your TinyAuth version** 
# — they are the single point of failure for both upstream identity 
# headers and credential injection. If `$auth_user` is empty, 
# injection fails closed and the app falls back to its own login form, 
# which is a confusing symptom with a trivial cause. 

# Confirm with `curl -i` against TinyAuth's `/api/auth` and read the response headers.