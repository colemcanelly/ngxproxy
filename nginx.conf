# Required to use JavaScript
load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    # Required by snippets/websocket.conf. Must live in the http context, so it
    # cannot be pushed down into a snippet included by a server block.
    # Sends "Connection: upgrade" only when the client asked for an upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
